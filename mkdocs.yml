site_name: Interactive Notebooks
site_description: Explorable explanations — marimo notebooks running in your
  browser via WebAssembly.
site_url: https://oishe.github.io/sparsity/
repo_url: https://github.com/Oishe/sparsity

docs_dir: docs
theme:
  name: shadcn
  show_title: true
  pygments_style:
    light: shadcn-light
    dark: github-dark
  katex_options: {}

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md

# The /app and /notebook exports are added by CI after this build, so their
# links don't resolve at build time — don't fail on them.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore
