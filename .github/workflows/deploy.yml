name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:          # lets you run it manually from the Actions tab

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Export notebook to WASM
        run: |
          uvx marimo export html-wasm --sandbox app.py -o _site --mode run --no-show-code
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write            # required: allow publishing to Pages
      id-token: write         # required: OIDC token the deploy action verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5