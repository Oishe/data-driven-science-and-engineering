[project]
name = "data-driven-science-and-engineering"
version = "0.1.0"
description = "Interactive marimo notebooks on data-driven science and engineering, running in the browser via WebAssembly."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oishe Farhan", email = "farhanoishe@gmail.com" }]
keywords = ["marimo", "webassembly", "signal-processing", "explorable-explanations"]

dependencies = [
  "marimo>=0.23.10",
  "matplotlib>=3.11.0",
  "numpy>=2.5.0",
  "pillow>=12.2.0",
  "pywavelets>=1.9.0",
  "scipy>=1.18.0",
]

[project.urls]
Homepage = "https://oishe.github.io/data-driven-science-and-engineering/"
Repository = "https://github.com/Oishe/data-driven-science-and-engineering"

[dependency-groups]
dev = [
  "fire>=0.7.1",
  "marimo[lsp,recommended]>=0.23.10",
  "mcp>=1",
  "pydantic>=2",
  "pytest>=9.1.1",
  "python-lsp-ruff>=2.3.1",
  "python-lsp-server>=1.14.0",
  "pyvis>=0.3.2",
  "ruff>=0.15.18",
  "websockets>=16.0",
]
extras = [
  "matplotlib>=3.11.0",
  "pandas>=3.0.3",
  "pygwalker>=0.5.0.1",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0.post1",
]
[tool.uv]
default-groups = ["dev", "extras"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.marimo.runtime]
output_max_bytes = 10_000_000
watcher_on_save = "autorun"
