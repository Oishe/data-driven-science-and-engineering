[project]
name = "sparsity"
version = "0.1.0"
description = "Sparsity Exploration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "marimo>=0.23.10",
  "matplotlib>=3.11.0",
  "numpy>=2.5.0",
  "pillow>=12.2.0",
  "pywavelets>=1.9.0",
  "scipy>=1.18.0",
]

[dependency-groups]
dev = [
  "fire>=0.7.1",
  "marimo[lsp,recommended]>=0.23.10",
  "mkdocs-shadcn>=0.2.3",
  "mcp>=1",
  "pydantic>=2",
  "pytest>=9.1.1",
  "python-lsp-ruff>=2.3.1",
  "python-lsp-server>=1.14.0",
  "pyvis>=0.3.2",
  "ruff>=0.15.18",
  "websockets>=16.0",
]
extras = [
  "matplotlib>=3.11.0",
  "pandas>=3.0.3",
  "pygwalker>=0.5.0.1",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0.post1",
]
[tool.uv]
default-groups = ["dev", "extras"]

[tool.ruff]
line-length = 100

[tool.marimo.runtime]
output_max_bytes = 10_000_000
watcher_on_save = "autorun"
